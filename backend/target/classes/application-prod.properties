# Production profile for deployment with MySQL
# WARNING: NEVER commit real credentials to version control!
# Always use environment variables in production.
server.port=${PORT:8080}

# MySQL Database for production
# CRITICAL: Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD via environment variables
# Use SSL in production: useSSL=true&requireSSL=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/career_portal_my?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Production settings with MySQL
# Use 'validate' or 'none' for production to prevent accidental schema changes
# 'update' can be used but is less safe
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JWT - Use environment variable in production
# CRITICAL: Set JWT_SECRET via environment variable with a strong random key (at least 256 bits)
# Never use default secret in production!
jwt.secret=${JWT_SECRET:CareerPortalSecretKeyForJWTTokenGenerationAndValidation2024MustBeAtLeast256Bits}
jwt.expiration-ms=86400000

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Cloudinary Configuration - Use environment variables
# WARNING: Replace with your own Cloudinary credentials
# If not set, file uploads will fail. Set these environment variables:
# CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dhfojyuqk}
cloudinary.api-key=${CLOUDINARY_API_KEY:667482513623359}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:fIcFx-KHYcxDWpBqbYSXQosMHVc}

# Production logging (reduced verbosity)
logging.level.com.careerportal=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN